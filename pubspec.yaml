name: weathernow
description: "A production-grade Flutter weather application built with Clean Architecture, BLoC, and offline-first design for the LumiCore Technical Assessment."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # HTTP Client
  dio: ^5.7.0

  # Local Storage / Offline Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.4.4

  # Functional Programming
  dartz: ^0.10.1

  # Connectivity
  connectivity_plus: ^6.0.5

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: any
  injectable_generator: any
  mocktail: any
  bloc_test: any
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo_transparent.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"

flutter_native_splash:
  color: "#0A0E1A"
  image: "assets/images/logo_transparent.png"
  android: true
  ios: true
